<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos y Cotizaciones — Decor Mueblería</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .status-badge { padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; }
    .status-borrador    { background:rgba(119,124,150,.15); color:#777c96; }
    .status-confirmada  { background:rgba(40,167,69,.12);   color:#28a745; }
    .status-en_produccion { background:rgba(0,123,255,.12); color:#007bff; }
    .status-lista       { background:rgba(192,122,58,.15);  color:#c07a3a; }
    .status-embarcada   { background:rgba(111,66,193,.12);  color:#6f42c1; }
    .status-entregada   { background:rgba(40,167,69,.12);   color:#28a745; }
    .status-cancelada   { background:rgba(220,53,69,.1);    color:#dc3545; }
    .tipo-linea         { color:#28a745; }
    .tipo-linea_especial { color:#f0ad4e; }
    .tipo-especial      { color:#dc3545; }
    .orders-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
    .orders-toolbar select, .orders-toolbar input {
      background:var(--color-gray-50); border:1px solid var(--color-gray-200);
      border-radius:8px; padding:8px 12px; font-size:.88rem; font-family:inherit; color:var(--color-gray-900);
    }
    .empty-state { text-align:center; padding:60px 20px; color:var(--color-gray-500); }
    .empty-state .material-symbols-rounded { font-size:3rem; opacity:.3; display:block; margin-bottom:12px; }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:grid; place-items:center; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal-box { background:#ffffff; border-radius:16px; width:min(700px,95vw); max-height:90vh; overflow-y:auto; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; z-index:201; }
    .modal-title { font-size:1.1rem; font-weight:700; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-grid .full { grid-column:1/-1; }
    .form-group label { display:block; font-size:.78rem; font-weight:600; color:var(--color-gray-600); margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; background:var(--color-gray-50); border:1px solid var(--color-gray-200);
      border-radius:8px; padding:9px 12px; font-size:.9rem; font-family:inherit;
    }
    .form-group textarea { min-height:60px; resize:vertical; }
    .items-section { margin-top:16px; }
    .items-section table { width:100%; font-size:.85rem; }
    .items-section th { font-size:.75rem; color:var(--color-gray-500); text-align:left; padding:6px 4px; border-bottom:1px solid var(--color-gray-200); }
    .items-section td { padding:6px 4px; }
    .items-section input, .items-section select { padding:6px 8px; font-size:.85rem; width:100%; }
    .btn-row { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  </style>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="sidebar-container"></aside>

  <main class="app-main">
    <header class="page-header">
      <div>
        <h1 class="page-title">Pedidos y Cotizaciones</h1>
        <p class="page-subtitle">Gestión de órdenes de producción al taller</p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openNewOrder()">
          <span class="material-symbols-rounded">add</span> Nueva Orden
        </button>
      </div>
    </header>

    <div class="orders-toolbar">
      <select id="filter-estatus" onchange="loadOrders()">
        <option value="">Todos los estatus</option>
        <option value="borrador">Borrador</option>
        <option value="confirmada">Confirmada</option>
        <option value="en_produccion">En Producción</option>
        <option value="lista">Lista</option>
        <option value="embarcada">Embarcada</option>
        <option value="entregada">Entregada</option>
        <option value="cancelada">Cancelada</option>
      </select>
      <div style="flex:1"></div>
      <span id="order-count" style="font-size:.82rem; color:var(--color-gray-500)"></span>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Folio</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Tipo</th>
              <th>Items</th>
              <th>Total</th>
              <th>Estatus</th>
              <th>Entrega Est.</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="8" class="empty-state">
              <span class="material-symbols-rounded">inventory</span>Cargando…
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Nueva/Editar Orden -->
  <div class="modal-overlay" id="order-modal">
    <div class="modal-box">
      <div class="modal-title">
        <span class="material-symbols-rounded">edit_note</span>
        <span id="modal-title-text">Nueva Orden</span>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label>Cliente *</label>
          <select id="f-cliente"></select>
        </div>
        <div class="form-group">
          <label>Tipo de Orden</label>
          <select id="f-tipo">
            <option value="linea">🟢 Línea</option>
            <option value="linea_especial">🟡 Línea Especial</option>
            <option value="especial">🔴 Especial</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de Entrega Estimada</label>
          <input type="date" id="f-entrega" />
        </div>
        <div class="form-group">
          <label>Estatus</label>
          <select id="f-estatus">
            <option value="borrador">Borrador</option>
            <option value="confirmada">Confirmada</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Notas</label>
          <textarea id="f-notas" placeholder="Observaciones del pedido…"></textarea>
        </div>
      </div>

      <!-- Items de la orden -->
      <div class="items-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="font-size:.88rem">Artículos</strong>
          <button class="btn btn-secondary btn-sm" onclick="addItemRow()">+ Agregar</button>
        </div>
        <table>
          <thead>
            <tr><th>Producto</th><th>Acabado</th><th style="width:70px">Cant.</th><th style="width:100px">Precio</th><th style="width:50px"></th></tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveOrder()">
          <span class="material-symbols-rounded">save</span> Guardar Orden
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    let orders = [], clients = [], products = [], acabados = [];
    let editingId = 0;

    document.addEventListener('DOMContentLoaded', async () => {
      const bp = basePath;
      // Cargar sidebar del dashboard
      await loadSidebar();
      const user = await loadCurrentUser();
      if (!user) return;
      applyRoleVisibility();
      await Promise.all([loadOrders(), loadFormData()]);
    });

    async function loadSidebar() {
      try {
        const resp = await fetch(basePath + '/views/dashboard.html');
        const html = await resp.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const sidebar = doc.querySelector('.app-sidebar');
        if (sidebar) {
          document.getElementById('sidebar-container').outerHTML = sidebar.outerHTML;
          // Fix links
          document.querySelectorAll('.app-sidebar a[href^="/views/"]').forEach(a => {
            a.href = basePath + a.getAttribute('href');
          });
          // Mark current page active
          document.querySelectorAll('.app-sidebar .nav-item').forEach(a => {
            a.classList.remove('active');
            if (a.href.includes('pedidos.html')) a.classList.add('active');
          });
        }
      } catch(e) { console.warn('Sidebar load failed', e); }
    }

    async function loadOrders() {
      const estatus = document.getElementById('filter-estatus').value;
      const qs = estatus ? `?estatus=${estatus}` : '';
      try {
        const res = await api('/ordenes/list.php' + qs);
        orders = res?.items || [];
        renderOrders();
      } catch(e) {
        document.getElementById('orders-body').innerHTML =
          '<tr><td colspan="8" class="empty-state"><span class="material-symbols-rounded">error</span>Error cargando órdenes</td></tr>';
      }
    }

    function renderOrders() {
      const tbody = document.getElementById('orders-body');
      document.getElementById('order-count').textContent = `${orders.length} orden(es)`;
      if (!orders.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><span class="material-symbols-rounded">inventory</span>No hay órdenes registradas</td></tr>';
        return;
      }
      const tipoIcons = { linea:'🟢', linea_especial:'🟡', especial:'🔴' };
      tbody.innerHTML = orders.map(o => `
        <tr style="cursor:pointer" onclick="editOrder(${o.id})">
          <td><strong>#${String(o.id).padStart(4,'0')}</strong></td>
          <td>${o.fecha_creacion}</td>
          <td>${o.cliente_nombre || '—'}</td>
          <td>${tipoIcons[o.tipo_orden]||''} ${o.tipo_orden.replace('_',' ')}</td>
          <td style="text-align:center">${o.total_items}</td>
          <td>$${parseFloat(o.total||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</td>
          <td><span class="status-badge status-${o.estatus}">${o.estatus.replace('_',' ')}</span></td>
          <td>${o.fecha_entrega_estimada || '—'}</td>
        </tr>
      `).join('');
    }

    async function loadFormData() {
      const [c, p, a] = await Promise.all([
        api('/clientes/list.php'),
        api('/categorias/list.php'),
        api('/acabados/list.php').catch(()=>({items:[]})),
      ]);
      clients  = c?.items || [];
      // Load productos for the item selector
      try { const pr = await api('/inventario/catalogo.php?tienda_id=1'); products = pr?.items || []; } catch { products = []; }
      try { const ac = await api('/acabados/list.php'); acabados = ac?.items || []; } catch { acabados = []; }

      const sel = document.getElementById('f-cliente');
      sel.innerHTML = '<option value="">— Seleccionar cliente —</option>' +
        clients.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
    }

    function openNewOrder() {
      editingId = 0;
      document.getElementById('modal-title-text').textContent = 'Nueva Orden';
      document.getElementById('f-cliente').value = '';
      document.getElementById('f-tipo').value = 'linea';
      document.getElementById('f-entrega').value = '';
      document.getElementById('f-estatus').value = 'borrador';
      document.getElementById('f-notas').value = '';
      document.getElementById('items-body').innerHTML = '';
      addItemRow();
      document.getElementById('order-modal').classList.add('open');
    }

    function editOrder(id) {
      // Simplified: just open modal for viewing
      const o = orders.find(x => x.id == id);
      if (!o) return;
      editingId = o.id;
      document.getElementById('modal-title-text').textContent = `Orden #${String(o.id).padStart(4,'0')}`;
      document.getElementById('f-cliente').value = '';
      document.getElementById('f-tipo').value = o.tipo_orden;
      document.getElementById('f-entrega').value = o.fecha_entrega_estimada || '';
      document.getElementById('f-estatus').value = o.estatus;
      document.getElementById('f-notas').value = o.notas || '';
      document.getElementById('items-body').innerHTML = '';
      addItemRow();
      document.getElementById('order-modal').classList.add('open');
    }

    function addItemRow() {
      const tbody = document.getElementById('items-body');
      const prodOpts = '<option value="">— Producto —</option>' +
        products.map(p => `<option value="${p.id}" data-price="${p.precio_venta}">${p.nombre} (${p.codigo_sku})</option>`).join('');
      const acabadoOpts = '<option value="">— Ninguno —</option>' +
        acabados.map(a => `<option value="${a.id}">${a.nombre}</option>`).join('');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><select class="item-prod" onchange="autoPrice(this)">${prodOpts}</select></td>
        <td><select class="item-acabado">${acabadoOpts}</select></td>
        <td><input type="number" class="item-qty" value="1" min="1" /></td>
        <td><input type="number" class="item-price" value="0" min="0" step="0.01" /></td>
        <td><button class="btn btn-secondary btn-sm" onclick="this.closest('tr').remove()" style="padding:4px 8px">✕</button></td>
      `;
      tbody.appendChild(tr);
    }

    function autoPrice(sel) {
      const opt = sel.selectedOptions[0];
      const price = opt?.dataset?.price || 0;
      sel.closest('tr').querySelector('.item-price').value = price;
    }

    async function saveOrder() {
      const items = [];
      document.querySelectorAll('#items-body tr').forEach(tr => {
        const pid = tr.querySelector('.item-prod')?.value;
        if (!pid) return;
        items.push({
          producto_id: parseInt(pid),
          acabado_id: tr.querySelector('.item-acabado')?.value || null,
          cantidad: parseFloat(tr.querySelector('.item-qty')?.value) || 1,
          precio_unitario: parseFloat(tr.querySelector('.item-price')?.value) || 0,
          descuento_item: 0
        });
      });

      const payload = {
        id: editingId,
        cliente_id: parseInt(document.getElementById('f-cliente').value),
        tipo_orden: document.getElementById('f-tipo').value,
        fecha_entrega_estimada: document.getElementById('f-entrega').value || null,
        estatus: document.getElementById('f-estatus').value,
        notas: document.getElementById('f-notas').value,
        items
      };

      if (!payload.cliente_id) { alert('Selecciona un cliente'); return; }

      try {
        await api('/ordenes/save.php', 'POST', payload);
        closeModal();
        loadOrders();
      } catch(e) { alert(e.message); }
    }

    function closeModal() {
      document.getElementById('order-modal').classList.remove('open');
    }

    async function logout() {
      if (confirm('¿Cerrar sesión?')) {
        await api('/auth/logout.php', 'POST');
        window.location.href = basePath + '/views/login.html';
      }
    }
  </script>
</body>
</html>
