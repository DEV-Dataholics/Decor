<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Productos — Decor Mueblería</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="app-layout">

  <!-- Sidebar Lateral (Copia idéntica del Dashboard) -->
  <aside class="app-sidebar" id="main-sidebar">
    <!-- El contenido se cargará o se mantendrá igual por consistencia -->
    <div class="sidebar-logo">
      <span>🪑 Decor</span>
      <small>Mueblería & Diseño</small>
    </div>
    <nav class="sidebar-nav" id="menu-nav">
      <!-- Los mismos links que dashboard.html -->
      <div class="nav-section-title">Principal</div>
      <a href="/views/dashboard.html" class="nav-item">
        <span class="material-symbols-rounded icon">dashboard</span> Dashboard
      </a>
      <div class="nav-section-title">Catálogos</div>
      <a href="/views/productos.html" class="nav-item active">
        <span class="material-symbols-rounded icon">chair</span> Productos
      </a>
      <!-- Otros links se inyectarán o mantendrán la estructura -->
    </nav>
    <div class="sidebar-footer" id="sidebar-user-info"></div>
  </aside>

  <!-- Contenido Principal -->
  <main class="app-main">
    <header class="page-header">
      <div>
        <h1 class="page-title">Catálogo de Productos</h1>
        <p class="page-subtitle">Gestión de muebles, SKU y precios base</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="btn-nuevo-producto">
          <span class="material-symbols-rounded">add</span> Nuevo Producto
        </button>
      </div>
    </header>

    <!-- Filtros y Búsqueda -->
    <section class="card" style="margin-bottom: var(--space-6);">
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: var(--space-4);">
            <div class="form-group">
                <input type="text" class="form-control" placeholder="Buscar por nombre o SKU..." id="search-input">
            </div>
            <div class="form-group">
                <select class="form-control" id="filter-category">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
            <div class="form-group">
                <button class="btn btn-secondary" style="width: 100%;">Filtrar</button>
            </div>
        </div>
    </section>

    <!-- Grid de Productos -->
    <section class="grid-layout" id="products-grid">
        <!-- Loader inicial -->
        <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
            <div class="loader"></div>
            <p style="margin-top: 1rem; color: var(--color-gray-500);">Cargando catálogo...</p>
        </div>
    </section>
  </main>

  <script src="../assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const bp = window.location.pathname.includes('/sistema_decor/') ? '/sistema_decor' : '';
      
      // Ajustar links
      document.querySelectorAll('a[href^="/views/"]').forEach(link => {
        link.setAttribute('href', bp + link.getAttribute('href'));
      });

      const user = await loadCurrentUser();
      if (user) {
         await loadCategorias();
         loadProducts();
      }

      // Event Listeners para filtros
      document.getElementById('search-input').addEventListener('input', debounce(loadProducts, 500));
      document.getElementById('filter-category').addEventListener('change', loadProducts);
    });

    // Función simple de debounce
    function debounce(func, wait) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }

    async function loadCategorias() {
        try {
            const { data } = await api('/categorias/list.php');
            const select = document.getElementById('filter-category');
            data.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = cat.nombre;
                select.appendChild(opt);
            });
        } catch (err) {
            console.error('Error cargando categorías', err);
        }
    }

    async function loadProducts(pagina = 1) {
        const grid = document.getElementById('products-grid');
        const search = document.getElementById('search-input').value.trim();
        const cat_id = document.getElementById('filter-category').value;
        
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem;"><div class="loader"></div><p>Cargando catálogo...</p></div>';

        try {
            let url = `/productos/list.php?pagina=${pagina}`;
            if (search) url += `&buscar=${encodeURIComponent(search)}`;
            if (cat_id) url += `&categoria_id=${cat_id}`;

            const { data } = await api(url);
            const { productos, total, paginas } = data;

            if (productos.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 4rem; background: #fff; border-radius: var(--radius-lg);">
                        <span class="material-symbols-rounded" style="font-size: 4rem; color: var(--color-gray-300);">inventory_2</span>
                        <h3>No hay productos</h3>
                        <p>No se encontraron muebles con los filtros actuales.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            productos.forEach(p => {
                const foto = (p.foto_url && p.foto_url.length > 0) ? p.foto_url[0] : '../assets/img/placeholder.jpg';
                const acabados = p.acabados.map(a => `<span class="badge" style="background:#eee; color:#333; font-size:10px; margin-right:4px;">${a.nombre}</span>`).join('');
                
                html += `
                <div class="card" style="display: flex; flex-direction: column; overflow: hidden;">
                    <div style="height: 200px; background: #eee; display:flex; align-items:center; justify-content:center;">
                        <!-- Si existiera imagen real la mostraríamos aquí -->
                        <span class="material-symbols-rounded" style="font-size: 4rem; color: #ccc;">chair</span>
                    </div>
                    <div style="padding: var(--space-4); flex: 1; display: flex; flex-direction: column;">
                        <div style="font-size: 10px; color: var(--color-gray-500); margin-bottom: 4px; display: flex; justify-content: space-between;">
                            <span>${p.sku || 'N/A'}</span>
                            <span>${p.categoria_nombre}</span>
                        </div>
                        <h3 style="margin-bottom: 8px; font-size: 16px;">${p.nombre}</h3>
                        
                        <div style="margin-bottom: 12px; min-height: 24px;">
                            ${acabados || '<span style="color:#aaa; font-size:11px;">Sin acabados definados</span>'}
                        </div>

                        <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: baseline;">
                            <span style="font-size: 18px; font-weight: 700; color: var(--color-wood-dark);">
                                $${parseFloat(p.precio_venta_base).toLocaleString('es-MX', {minimumFractionDigits:2})}
                            </span>
                            <button class="btn btn-secondary btn-sm" onclick="editProduct(${p.id})">Editar</button>
                        </div>
                    </div>
                </div>
                `;
            });
            
            grid.innerHTML = html;

        } catch (err) {
            console.error(err);
            grid.innerHTML = `<div style="grid-column: 1/-1; padding: 2rem; color: red;">Error: ${err.message}</div>`;
        }
    }

    function editProduct(id) {
        alert('Abrir modal/página para editar producto ' + id);
    }
  </script>
</body>
</html>
