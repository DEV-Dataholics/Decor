<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embarques — Decor Mueblería</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .status-badge { padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; text-transform:uppercase; }
    .status-preparando  { background:rgba(119,124,150,.12); color:#777c96; }
    .status-embarcado   { background:rgba(0,123,255,.1);    color:#007bff; }
    .status-en_transito { background:rgba(192,122,58,.12);  color:#c07a3a; }
    .status-entregado   { background:rgba(40,167,69,.1);    color:#28a745; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--color-gray-500); }
    .empty-state .material-symbols-rounded { font-size:3rem; display:block; opacity:.3; margin-bottom:12px; }
    .embarque-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:16px; }
    .embarque-card {
      background:var(--color-white); border:1px solid var(--color-gray-200); border-radius:12px;
      padding:18px; transition:border-color .15s;
    }
    .embarque-card:hover { border-color:#c07a3a; }
    .embarque-header { display:flex; justify-content:space-between; align-items:start; margin-bottom:10px; }
    .embarque-folio { font-weight:700; font-size:1rem; }
    .embarque-meta { font-size:.82rem; color:var(--color-gray-500); display:flex; flex-direction:column; gap:4px; }
    .embarque-meta span { display:flex; align-items:center; gap:6px; }
    .embarque-meta .material-symbols-rounded { font-size:16px; }
    .embarque-stats { display:flex; gap:16px; margin-top:10px; padding-top:10px; border-top:1px solid var(--color-gray-100); font-size:.82rem; }
    .embarque-stat { display:flex; align-items:center; gap:4px; }
    .embarque-stat strong { color:var(--color-gray-900); }
  </style>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="sidebar-container"></aside>
  <main class="app-main">
    <header class="page-header">
      <div>
        <h1 class="page-title">Embarques y Logística</h1>
        <p class="page-subtitle">Control de envíos del taller a las tiendas</p>
      </div>
    </header>

    <div class="embarque-cards" id="embarques-grid">
      <div class="empty-state" style="grid-column:1/-1">
        <span class="material-symbols-rounded">local_shipping</span>Cargando embarques…
      </div>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadSidebar('embarques.html');
      const user = await loadCurrentUser();
      if (!user) return;
      applyRoleVisibility();
      await loadEmbarques();
    });

    async function loadSidebar(activePage) {
      try {
        const resp = await fetch(basePath + '/views/dashboard.html');
        const html = await resp.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const sidebar = doc.querySelector('.app-sidebar');
        if (sidebar) {
          document.getElementById('sidebar-container').outerHTML = sidebar.outerHTML;
          document.querySelectorAll('.app-sidebar a[href^="/views/"]').forEach(a => { a.href = basePath + a.getAttribute('href'); });
          document.querySelectorAll('.app-sidebar .nav-item').forEach(a => {
            a.classList.remove('active');
            if (a.href.includes(activePage)) a.classList.add('active');
          });
        }
      } catch(e) {}
    }

    async function loadEmbarques() {
      try {
        const res = await api('/embarques/list.php');
        const items = res?.items || [];
        const grid = document.getElementById('embarques-grid');
        if (!items.length) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><span class="material-symbols-rounded">local_shipping</span>No hay embarques registrados</div>';
          return;
        }
        grid.innerHTML = items.map(e => `
          <div class="embarque-card">
            <div class="embarque-header">
              <div class="embarque-folio">📦 Embarque #${String(e.id).padStart(4,'0')}</div>
              <span class="status-badge status-${e.estatus}">${e.estatus.replace('_',' ')}</span>
            </div>
            <div class="embarque-meta">
              <span><span class="material-symbols-rounded">store</span>Destino: ${e.tienda_destino || '—'}</span>
              <span><span class="material-symbols-rounded">event</span>Fecha: ${e.fecha_embarque || '—'}</span>
              <span><span class="material-symbols-rounded">directions_car</span>Placas: ${e.placas_trailer || '—'}</span>
              <span><span class="material-symbols-rounded">person</span>Transportista: ${e.transportista || '—'}</span>
              ${e.folio_carta_porte ? `<span><span class="material-symbols-rounded">description</span>Carta Porte: ${e.folio_carta_porte}</span>` : ''}
              ${e.orden_id ? `<span><span class="material-symbols-rounded">receipt</span>Orden #${String(e.orden_id).padStart(4,'0')}</span>` : ''}
            </div>
            <div class="embarque-stats">
              <div class="embarque-stat"><strong>${e.total_items || 0}</strong> líneas</div>
              <div class="embarque-stat"><strong>${e.total_piezas || 0}</strong> piezas</div>
            </div>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('embarques-grid').innerHTML =
          '<div class="empty-state" style="grid-column:1/-1"><span class="material-symbols-rounded">error</span>Error cargando embarques</div>';
      }
    }
  </script>
</body>
</html>
