<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compras Externas — Decor Mueblería</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .status-badge { padding:3px 10px; border-radius:20px; font-size:.72rem; font-weight:700; text-transform:uppercase; }
    .status-registrada   { background:rgba(119,124,150,.12); color:#777c96; }
    .status-recibida     { background:rgba(0,123,255,.1);    color:#007bff; }
    .status-en_inventario { background:rgba(40,167,69,.1);   color:#28a745; }
    .empty-state { text-align:center; padding:60px 20px; color:var(--color-gray-500); }
    .empty-state .material-symbols-rounded { font-size:3rem; display:block; opacity:.3; margin-bottom:12px; }
    .compras-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(360px,1fr)); gap:16px; }
    .compra-card {
      background:var(--color-white); border:1px solid var(--color-gray-200); border-radius:12px;
      padding:18px; transition:border-color .15s;
    }
    .compra-card:hover { border-color:#c07a3a; }
    .compra-header { display:flex; justify-content:space-between; align-items:start; margin-bottom:10px; }
    .compra-folio { font-weight:700; font-size:1rem; }
    .compra-meta { font-size:.82rem; color:var(--color-gray-500); display:flex; flex-direction:column; gap:4px; }
    .compra-meta span { display:flex; align-items:center; gap:6px; }
    .compra-meta .material-symbols-rounded { font-size:16px; }
    .compra-total { font-size:1.1rem; font-weight:700; color:#c07a3a; margin-top:10px; padding-top:10px; border-top:1px solid var(--color-gray-100); }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:grid; place-items:center; z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal-box { background:#ffffff; border-radius:16px; width:min(600px,95vw); max-height:90vh; overflow-y:auto; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; z-index:201; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-grid .full { grid-column:1/-1; }
    .form-group label { display:block; font-size:.78rem; font-weight:600; color:var(--color-gray-600); margin-bottom:4px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; background:var(--color-gray-50); border:1px solid var(--color-gray-200);
      border-radius:8px; padding:9px 12px; font-size:.9rem; font-family:inherit;
    }
    .btn-row { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
  </style>
</head>
<body class="app-layout">
  <aside class="app-sidebar" id="sidebar-container"></aside>
  <main class="app-main">
    <header class="page-header">
      <div>
        <h1 class="page-title">Compras Externas</h1>
        <p class="page-subtitle">Artesanías, piezas únicas y muebles de proveedores externos</p>
      </div>
      <div>
        <button class="btn btn-primary" onclick="openNewCompra()">
          <span class="material-symbols-rounded">add</span> Nueva Compra
        </button>
      </div>
    </header>

    <div class="compras-grid" id="compras-grid">
      <div class="empty-state" style="grid-column:1/-1">
        <span class="material-symbols-rounded">shopping_bag</span>Cargando compras…
      </div>
    </div>
  </main>

  <!-- Modal Nueva Compra -->
  <div class="modal-overlay" id="compra-modal">
    <div class="modal-box">
      <h3 style="margin-bottom:16px; display:flex; align-items:center; gap:8px">
        <span class="material-symbols-rounded">shopping_bag</span> Registrar Compra Externa
      </h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Proveedor</label>
          <input type="text" id="f-proveedor" placeholder="Nombre del proveedor" />
        </div>
        <div class="form-group">
          <label>Tienda Destino</label>
          <select id="f-tienda">
            <option value="1">Taller Principal</option>
          </select>
        </div>
        <div class="form-group">
          <label>Folio Factura</label>
          <input type="text" id="f-folio" placeholder="Factura / Recibo" />
        </div>
        <div class="form-group">
          <label>Total de Compra</label>
          <input type="number" id="f-total" min="0" step="0.01" placeholder="$0.00" />
        </div>
        <div class="form-group full">
          <label>Notas</label>
          <textarea id="f-notas" placeholder="Contexto: feria artesanal, lote de liquidación, etc."></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveCompra()">
          <span class="material-symbols-rounded">save</span> Guardar
        </button>
      </div>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadSidebar('compras_externas.html');
      const user = await loadCurrentUser();
      if (!user) return;
      applyRoleVisibility();
      await loadCompras();
    });

    async function loadSidebar(activePage) {
      try {
        const resp = await fetch(basePath + '/views/dashboard.html');
        const html = await resp.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const sidebar = doc.querySelector('.app-sidebar');
        if (sidebar) {
          document.getElementById('sidebar-container').outerHTML = sidebar.outerHTML;
          document.querySelectorAll('.app-sidebar a[href^="/views/"]').forEach(a => { a.href = basePath + a.getAttribute('href'); });
          document.querySelectorAll('.app-sidebar .nav-item').forEach(a => {
            a.classList.remove('active');
            if (a.href.includes(activePage)) a.classList.add('active');
          });
        }
      } catch(e) {}
    }

    async function loadCompras() {
      try {
        const res = await api('/compras/list.php');
        const items = res?.items || [];
        renderCompras(items);
      } catch {
        renderCompras([]);
      }
    }

    function renderCompras(items) {
      const grid = document.getElementById('compras-grid');
      if (!items.length) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><span class="material-symbols-rounded">shopping_bag</span>No hay compras externas registradas<br><small>Presiona "Nueva Compra" para registrar una</small></div>';
        return;
      }
      grid.innerHTML = items.map(c => `
        <div class="compra-card">
          <div class="compra-header">
            <div class="compra-folio">🛒 Compra #${String(c.id).padStart(4,'0')}</div>
            <span class="status-badge status-${c.estatus}">${c.estatus.replace('_',' ')}</span>
          </div>
          <div class="compra-meta">
            <span><span class="material-symbols-rounded">store</span>Proveedor: ${c.proveedor_nombre || '—'}</span>
            <span><span class="material-symbols-rounded">event</span>Fecha: ${c.fecha_compra || '—'}</span>
            <span><span class="material-symbols-rounded">receipt</span>Factura: ${c.folio_factura || '—'}</span>
            <span><span class="material-symbols-rounded">storefront</span>Destino: ${c.tienda_nombre || '—'}</span>
            ${c.notas ? `<span><span class="material-symbols-rounded">notes</span>${c.notas}</span>` : ''}
          </div>
          <div class="compra-total">Total: $${parseFloat(c.total_compra||0).toLocaleString('es-MX',{minimumFractionDigits:2})}</div>
        </div>
      `).join('');
    }

    function openNewCompra() { document.getElementById('compra-modal').classList.add('open'); }
    function closeModal()    { document.getElementById('compra-modal').classList.remove('open'); }

    async function saveCompra() {
      const payload = {
        proveedor_nombre: document.getElementById('f-proveedor').value,
        tienda_destino_id: parseInt(document.getElementById('f-tienda').value),
        folio_factura: document.getElementById('f-folio').value,
        total_compra: parseFloat(document.getElementById('f-total').value) || 0,
        notas: document.getElementById('f-notas').value
      };
      if (!payload.proveedor_nombre) { alert('Ingresa el proveedor'); return; }
      try {
        await api('/compras/save.php', 'POST', payload);
        closeModal();
        loadCompras();
      } catch(e) { alert(e.message); }
    }
  </script>
</body>
</html>
