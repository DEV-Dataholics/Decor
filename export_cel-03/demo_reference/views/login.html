<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Decor Mueblería</title>
  <meta name="description" content="Acceso al sistema de gestión Decor Mueblería" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    body {
      background: linear-gradient(135deg, var(--color-wood-dark) 0%, var(--color-wood) 50%, var(--color-wood-light) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .login-brand .logo-icon {
      font-size: 3rem;
      display: block;
      margin-bottom: var(--space-3);
    }

    .login-brand h1 {
      color: #fff;
      font-size: var(--font-size-2xl);
      letter-spacing: -0.02em;
    }

    .login-brand p {
      color: rgba(255,255,255,0.65);
      font-size: var(--font-size-sm);
      margin-top: var(--space-1);
    }

    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-lg);
    }

    .login-card h2 {
      font-size: var(--font-size-xl);
      font-weight: 700;
      margin-bottom: var(--space-6);
      color: var(--color-gray-900);
    }

    .login-form { display: flex; flex-direction: column; gap: var(--space-5); }

    .login-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--font-size-xs);
      color: rgba(255,255,255,0.5);
    }

    #error-msg {
      display: none;
      background-color: var(--color-danger-bg);
      color: var(--color-danger);
      border: 1px solid var(--color-danger);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--font-size-sm);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">

    <div class="login-brand">
      <span class="logo-icon">🪑</span>
      <h1>Decor Mueblería</h1>
      <p>Sistema de Gestión Interno</p>
    </div>

    <div class="login-card">
      <h2>Iniciar sesión</h2>

      <div id="error-msg" role="alert"></div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="form-control"
            placeholder="usuario@decor.mx"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary btn-lg">
          <span id="btn-text">Entrar</span>
          <span id="btn-loader" class="loader" style="display:none"></span>
        </button>
      </form>
    </div>

    <p class="login-footer">Decor Mueblería © 2026 — Uso interno</p>
  </div>

  <script src="../assets/js/api.js"></script>
  <script>
    // Si ya hay sesión activa, redirigir al dashboard
    (async () => {
      try {
        const user = await api('/auth/me.php');
        if (user) redirectByRole(user.rol);
      } catch { /* no hay sesión, continuar */ }
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errBox   = document.getElementById('error-msg');
      const btnText  = document.getElementById('btn-text');
      const loader   = document.getElementById('btn-loader');
      const btn      = document.getElementById('btn-login');

      errBox.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Verificando...';
      loader.style.display = 'inline-block';

      try {
        const { user } = await api('/auth/login.php', 'POST', { email, password });
        redirectByRole(user.rol);
      } catch (err) {
        errBox.textContent = err.message || 'Credenciales incorrectas';
        errBox.style.display = 'block';
        btn.disabled = false;
        btnText.textContent = 'Entrar';
        loader.style.display = 'none';
      }
    });

    function redirectByRole(rol) {
      const bp = window.location.pathname.includes('/sistema_decor/') ? '/sistema_decor' : '';
      const routes = {
        admin:            `${bp}/views/dashboard.html`,
        gerente_tienda:   `${bp}/views/pedidos.html`,
        encargado_taller: `${bp}/views/produccion.html`,
        cajero:           `${bp}/views/pos.html`,
        carpintero:       `${bp}/views/kanban.html`,
        bodega:           `${bp}/views/inventario_taller.html`,
      };
      window.location.href = routes[rol] || `${bp}/views/dashboard.html`;
    }
  </script>
</body>
</html>
